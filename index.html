<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTH Check-in System</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f4f7f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #e67e22; margin: 0 0 15px 0; font-size: 20px; line-height: 1.4; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 1.5px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: 'Sarabun'; font-size: 16px; outline: none; background-color: #fff; }
        select:focus, input:focus { border-color: #e67e22; }
        #video, #preview { width: 100%; border-radius: 10px; margin: 10px 0; display: none; }
        #video { background: #000; transform: scaleX(-1); }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Sarabun'; transition: 0.3s; }
        .btn-cam { background: #34495e; color: white; }
        .btn-submit { background: #e67e22; color: white; display: none; }
        #status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>MTH67-207 and MTH67-207E Check-in</h2>
    
    <select id="week">
        <option value="" disabled selected>-- เลือกสัปดาห์ที่เช็คอิน --</option>
        <script>
            // ใช้ Loop สร้างตัวเลือก 1-15 เพื่อความรวดเร็วและถูกต้อง
            for(let i=1; i<=15; i++) {
                document.write(`<option value="${i}">สัปดาห์ที่ ${i}</option>`);
            }
        </script>
    </select>

    <input type="text" id="id" placeholder="รหัสประจำตัว / ID">
    <input type="text" id="name" placeholder="ชื่อ-นามสกุล">
    
    <select id="sec">
        <option value="" disabled selected>-- เลือกกลุ่มเรียน (Section) --</option>
        <option value="1">Section 1</option>
        <option value="2">Section 2</option>
        <option value="3">Section 3</option>
        <option value="E">Section E</option>
    </select>

    <video id="video" autoplay playsinline></video>
    <img id="preview">
    <canvas id="canvas" style="display:none;"></canvas>

    <button id="btnCam" class="btn-cam" onclick="openCam()">เปิดกล้องถ่ายรูป</button>
    <button id="btnSnap" class="btn-cam" style="display:none;" onclick="takeSnap()">กดถ่ายรูป</button>
    <button id="btnSubmit" class="btn-submit" onclick="process()">บันทึกข้อมูล</button>
    
    <div id="status"></div>
</div>

<script>
    let localStream;
    let base64Photo = null;
    const TARGET = { lat: 8.641774, lng: 99.897022, radius: 1000 };
    
    // Web App URL ล่าสุดของคุณ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgt1yO4_SYSYsxoGcT_QAfvUG_O5y3zAsTcW0r-ojAw4j7Hz2piAkUICLCCZ7l4rR_/exec";

    async function openCam() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const v = document.getElementById('video');
            v.srcObject = localStream;
            v.style.display = "block";
            document.getElementById('btnCam').style.display = "none";
            document.getElementById('btnSnap').style.display = "block";
        } catch (e) { alert("เข้าถึงกล้องไม่ได้"); }
    }

    function takeSnap() {
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        const p = document.getElementById('preview');
        c.width = 400; c.height = 300;
        c.getContext('2d').drawImage(v, 0, 0, 400, 300);
        base64Photo = c.toDataURL('image/jpeg', 0.6);
        p.src = base64Photo;
        p.style.display = "block";
        v.style.display = "none";
        document.getElementById('btnSnap').innerText = "ถ่ายใหม่";
        document.getElementById('btnSubmit').style.display = "block";
        localStream.getTracks().forEach(t => t.stop());
    }

    function process() {
        const id = document.getElementById('id').value;
        const name = document.getElementById('name').value;
        const week = document.getElementById('week').value;
        const sec = document.getElementById('sec').value;
        if(!id || !name || !week || !sec || !base64Photo) return alert("กรุณากรอกข้อมูลและถ่ายรูปให้ครบถ้วน");

        document.getElementById('status').innerText = "กำลังตรวจสอบพิกัด GPS...";
        navigator.geolocation.getCurrentPosition(pos => {
            const dist = getDist(pos.coords.latitude, pos.coords.longitude, TARGET.lat, TARGET.lng);
            if(dist <= TARGET.radius) {
                upload(id, name, week, sec, pos.coords.latitude, pos.coords.longitude, "ในพื้นที่");
            } else {
                document.getElementById('status').innerText = `อยู่นอกพื้นที่ (${Math.round(dist)} ม.)`;
                document.getElementById('status').style.color = "red";
            }
        }, () => alert("โปรดอนุญาต GPS"), { enableHighAccuracy: true });
    }

    function getDist(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function upload(id, name, week, section, lat, lng, status) {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ id, name, week, section, lat, lng, status, photo: base64Photo })
        }).then(() => {
            document.getElementById('status').innerText = "✅ บันทึกสำเร็จ (สัปดาห์ที่ " + week + ")";
            document.getElementById('status').style.color = "green";
            document.getElementById('btnSubmit').disabled = true;
        });
    }
</script>
</body>
</html>
